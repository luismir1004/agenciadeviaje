<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect width="192" height="192" rx="0" fill="#0F172A"/>
  <!-- Compass Rose / Globe -->
  <circle cx="96" cy="90" r="48" fill="none" stroke="#2563EB" stroke-width="2.5" opacity="0.3"/>
  <circle cx="96" cy="90" r="32" fill="none" stroke="#2563EB" stroke-width="1.5" opacity="0.2"/>
  <!-- N/S/E/W lines -->
  <line x1="96" y1="38" x2="96" y2="142" stroke="#2563EB" stroke-width="1" opacity="0.15"/>
  <line x1="44" y1="90" x2="148" y2="90" stroke="#2563EB" stroke-width="1" opacity="0.15"/>
  <!-- Compass needle N -->
  <polygon points="96,42 90,70 96,64 102,70" fill="#2563EB"/>
  <!-- Compass needle S -->
  <polygon points="96,138 90,110 96,116 102,110" fill="#2563EB" opacity="0.3"/>
