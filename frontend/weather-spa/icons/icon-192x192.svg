  <!-- Brand text -->
  <text x="96" y="168" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="0.15em">NEXTGEN</text>
</svg>
